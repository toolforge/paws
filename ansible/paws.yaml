---

- name: Deploy PAWS to k8s cluster
  gather_facts: false
  hosts: localhost
  vars:
    istio_chart_repo: https://istio-release.storage.googleapis.com/charts
    istio_version: 1.27.1
    gateway_api_crds_url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
    istio_gateway_values:
      service:
        type: NodePort
        ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 80
            nodePort: 30001
  tasks:
    - name: include env vars
      include_vars: vars/{{ datacenter }}.yaml

    - name: Temporary directory for cloud provider
      ansible.builtin.tempfile:
        state: directory
        suffix: paws
      register: paws_dir
      changed_when: False

    - name: Clone cloud-provider-openstack
      ansible.builtin.git:
        repo: https://github.com/kubernetes/cloud-provider-openstack.git
        dest: "{{ paws_dir.path }}"
        version: v1.26.3
      changed_when: False

    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: files/csi-secret-cinderplugin.yaml.{{ datacenter }}.crypt
        dest: "{{ paws_dir.path }}/manifests/cinder-csi-plugin/csi-secret-cinderplugin.yaml"
      changed_when: False

    - name: install the things!
      kubernetes.core.k8s:
        state: present
        src: "{{ paws_dir.path }}/manifests/cinder-csi-plugin/{{ item }}"
      loop:
        - "csi-secret-cinderplugin.yaml"
        - "cinder-csi-controllerplugin-rbac.yaml"
        - "cinder-csi-controllerplugin.yaml"
        - "cinder-csi-nodeplugin-rbac.yaml"
        - "cinder-csi-nodeplugin.yaml"
        - "csi-cinder-driver.yaml"

    - name: Delete temporary directory
      ansible.builtin.file:
        state: absent
        path: "{{ paws_dir.path }}"
      changed_when: False

    - name: and sc.yaml
      kubernetes.core.k8s:
        state: present
        src: "files/sc.yaml"

    # Install the CRDs before istiod starts, so that istiod watches them.
    - name: Install the Gateway API CRDs
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.url', gateway_api_crds_url, split_lines=False) | from_yaml_all | list }}"

    - name: Deploy istio base
      kubernetes.core.helm:
        name: istio-base
        chart_ref: base
        chart_repo_url: "{{ istio_chart_repo }}"
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        create_namespace: true

    - name: Deploy istiod
      kubernetes.core.helm:
        name: istiod
        chart_ref: istiod
        chart_repo_url: "{{ istio_chart_repo }}"
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        wait: true
        values: >-
          {{ {'pilot': {'resources': {'requests': istio_requests}}}
             if istio_requests is defined else {} }}

    # This deployment holds the NodePort (30001) that the front proxy sends
    # traffic to. The paws-gateway Gateway uses this deployment.
    - name: Deploy istio ingress gateway
      kubernetes.core.helm:
        name: istio-ingressgateway
        chart_ref: gateway
        chart_repo_url: "{{ istio_chart_repo }}"
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        values: >-
          {{ istio_gateway_values
             | combine({'resources': {'requests': istio_requests}}
                       if istio_requests is defined else {}) }}

    # The HTTPRoutes of PAWS and prometheus attach to this Gateway.
    # The address binds the Gateway to the istio-ingressgateway deployment,
    # so istio does not create a new deployment and service for it.
    - name: Create the paws-gateway Gateway
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: paws-gateway
            namespace: istio-system
          spec:
            gatewayClassName: istio
            addresses:
              - type: Hostname
                value: istio-ingressgateway.istio-system.svc.cluster.local
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All

    - name: Add jupyterhub chart repo
      kubernetes.core.helm_repository:
        name: jupyterhub
        repo_url: "https://jupyterhub.github.io/helm-chart/"

    - name: Deploy paws
      kubernetes.core.helm:
        name: paws
        chart_ref: ../paws
        release_namespace: "{{ namespace }}"
        create_namespace: true
        values_files:
          - ../paws/{{ secret_file }}.yaml
          - ../paws/{{ env_file }}.yaml
        dependency_update: true

    - name: Create metrics namespace for prometheus
      kubernetes.core.k8s:
        name: metrics
        kind: Namespace
        state: present

    - name: Prometheus
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_version: 25.26.0
        release_namespace: metrics
        create_namespace: true
        set_values:
          - value: prometheus.retention=30d
            value_type: string

    - name: HTTPRoute for prometheus
      kubernetes.core.k8s:
        state: present
        template: "templates/prometheus-route.yaml.j2"
        namespace: metrics
