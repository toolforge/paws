---

{{ if .Values.pawsPublicEnabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paws-public
# nbserve and the renderer do not use the Kubernetes API
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: nbserve
  name: nbserve
spec:
  replicas: {{ .Values.pawspublic.nbserve.replicas }}
  selector:
    matchLabels:
      name: nbserve
  template:
    metadata:
      creationTimestamp: null
      labels:
        name: nbserve
    spec:
      serviceAccount: paws-public
      containers:
        - image: {{ tpl .Values.pawspublic.nbserve.image.template . | quote }}
          imagePullPolicy: Always
          name: nbserve
          ports:
            - containerPort: 8000
              name: nbserve
              protocol: TCP
          volumeMounts:
            - mountPath: /data/project/paws/userhomes
              name: pawshomes
            - name: nginx-conf
              mountPath: /mnt
          resources:
            requests:
              memory: {{ .Values.pawspublic.nbserve.requests.memory }}
              cpu: "50m"

      volumes:
{{ if .Values.localdev.enabled }}
        - hostPath:
            path: /srv/paws/project/paws/userhomes
{{ else }}
        - nfs:
{{- with (index .Values.jupyterhub.hub.extraVolumes 0) }}
            server: {{ .nfs.server }}
{{- end }}
            path: /srv/paws/project/paws/userhomes
{{ end }}
          name: pawshomes
        - name: nginx-conf
          configMap:
            name: nbserve-nginx

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: renderer
  name: renderer
spec:
  selector:
    matchLabels:
      name: renderer
  template:
    metadata:
      labels:
        name: renderer
    spec:
      serviceAccount: paws-public
      containers:
        - env:
            - name: BASE_PATH
              value: /data/project/paws/userhomes/
            - name: URL_PREFIX
              value: /
          image: {{ tpl .Values.pawspublic.renderer.image.template . | quote }}
          imagePullPolicy: Always
          name: renderer
          ports:
            - containerPort: 8000
              name: nbserve
              protocol: TCP
          volumeMounts:
            - mountPath: /data/project/paws/userhomes
              name: pawshomes
              readOnly: true
          resources:
            requests:
              memory: {{ .Values.pawspublic.renderer.requests.memory }}
              cpu: {{ .Values.pawspublic.renderer.requests.cpu }}
            limits:
              cpu: 2000m
      volumes:
{{ if .Values.localdev.enabled }}
        - hostPath:
            path: /srv/paws/project/paws/userhomes
{{ else }}
        - nfs:
{{- with (index .Values.jupyterhub.hub.extraVolumes 0) }}
            server: {{ .nfs.server }}
{{- end }}
            path: /srv/paws/project/paws/userhomes
{{ end }}
          name: pawshomes
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: renderer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: renderer
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 200
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: paws-public
  name: paws-public
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    name: nbserve
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: renderer
  name: renderer
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    name: renderer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    name: renderer
  name: renderer
spec:
  podSelector:
    matchLabels:
      name: renderer
  policyTypes:
    - Ingress
  ingress:
    # Only nbserve sends requests to the renderer.
    # User pods must not bypass the nginx checks in nbserve.
    - from:
        - podSelector:
            matchLabels:
              name: nbserve
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    name: paws-public-custom
    ingress.paws.wmcloud.org: public
  name: paws-public-custom
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
  hostnames:
    - {{ .Values.pawspublic.ingress.host | quote }}
  rules:
    - backendRefs:
        - name: paws-public
          port: 8000
{{ end }}
