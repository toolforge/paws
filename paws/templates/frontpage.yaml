---

{{ if .Values.paws.frontPageEnabled }}
{{- $redirect := urlParse .Values.paws.ingress.frontRedirect }}
# Send a permanent redirect to frontRedirect for all requests to frontHost.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    name: paws-front-page
    ingress.paws.wmcloud.org: front
  name: paws-front-page
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
  hostnames:
    - {{ .Values.paws.ingress.frontHost | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ $redirect.scheme | quote }}
            hostname: {{ $redirect.host | quote }}
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $redirect.path | quote }}
            statusCode: 301
{{ end }}
