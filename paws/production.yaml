---

mysql:
  domain: analytics.db.svc.eqiad.wmflabs
  # TODO: remove this when the multiinstance replica proxy is removed
  host: enwiki.analytics.db.svc.eqiad.wmflabs
jupyterhub:
  hub:
    extraVolumes:
      - name: homes
        nfs:
          server: paws-nfs.svc.paws.eqiad1.wikimedia.cloud
          path: /srv/paws/project

    extraConfig:
      00-myConfig: |
          localdev = False
          nfs_home = 'paws-nfs.svc.paws.eqiad1.wikimedia.cloud'
          dumps_src1 = 'clouddumps1001.wikimedia.org'
          dumps_src2 = 'clouddumps1002.wikimedia.org'
  ingress:
    enabled: true
    hosts:
      - hub-paws.wmcloud.org
  singleuser:
    extraEnv:
      HUB_DOMAIN: "hub-paws.wmcloud.org"  # Check jupyterhub.ingress.hosts
minesweeper:
  enabled: true
maintainDumpsNfs:
  enabled: false
  server: dumps-nfs.wikimedia.org
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
localdev:
  enabled: false
pawspublic:
  nbserve:
    requests:
      memory: "2000Mi"
  ingress:
    host: public-paws.wmcloud.org
  renderer:
    requests:
      cpu: "500m"
      memory: "1000Mi"
